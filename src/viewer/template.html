<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gloop log viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #ffffff; --line: #d9d9d4; --fg: #1d1d1b; --muted: #6b6b66;
    --accent: #3b6ef5; --ok: #2e9e5b; --err: #d64545; --warn: #d69a2e; --int: #8a63d2; --queued: #9a9a95;
    --sel: #e8efff; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --line: #2f2f34; --fg: #ececea; --muted: #9a9a96;
      --accent: #7aa2ff; --ok: #4fc47c; --err: #ff6b6b; --warn: #f0b04a; --int: #b28cff; --queued: #77777a;
      --sel: #24304d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .sources { color: var(--muted); font-family: var(--mono); font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header label.btn, header .stats { font-size: 12px; }
  label.btn { border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; background: var(--bg); }
  label.btn input { display: none; }
  .stats { color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  #graphWrap { position: relative; overflow: auto; border-right: 1px solid var(--line); }
  #graphWrap.empty::after { content: "Drop one or more .jsonl session logs anywhere on this page"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  #graph { display: block; min-width: 100%; }
  #graph .node { cursor: pointer; }
  #graph .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; rx: 8; }
  #graph .node.selected rect { stroke: var(--accent); stroke-width: 2; }
  #graph .node text { fill: var(--fg); font-size: 12px; }
  #graph .node .meta { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
  #graph .node .bar { rx: 8; }
  #graph .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
  #graph .edge.dangling { stroke-dasharray: 4 4; }
  #graph .edgeLabel { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
  #graph .arrow { fill: var(--muted); }
  #side { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .panel { overflow: auto; padding: 10px 12px; min-height: 0; }
  .panel + .panel { border-top: 1px solid var(--line); }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .ev { display: grid; grid-template-columns: 52px 128px 1fr; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; align-items: baseline; }
  .ev:hover { background: var(--sel); }
  .ev.selected { background: var(--sel); outline: 1px solid var(--accent); }
  .ev .seq { color: var(--muted); }
  .ev .type { color: var(--accent); }
  .ev .sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .ev.dim { opacity: .55; }
  pre { margin: 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
  .chip { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; cursor: pointer; background: var(--panel); }
  .chip.other { border-color: var(--accent); }
  footer { grid-column: 1 / -1; border-top: 1px solid var(--line); background: var(--panel); display: grid; grid-template-columns: 1fr; }
  #scrubRow { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  #scrubRow input[type=range] { flex: 1; }
  #scrubRow select { font: inherit; }
  #scrubLabel { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 220px; }
  #state { display: grid; grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr); gap: 0; max-height: 34vh; min-height: 120px; }
  #state .panel { overflow: auto; }
  #state .panel + .panel { border-top: none; border-left: 1px solid var(--line); }
  .msg { border-left: 3px solid var(--line); padding: 3px 8px; margin: 4px 0; }
  .msg.user { border-color: var(--accent); } .msg.assistant { border-color: var(--ok); } .msg.tool { border-color: var(--warn); } .msg.system { border-color: var(--int); }
  .msg .role { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .msg .body { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  .kv { font-family: var(--mono); font-size: 11.5px; margin: 2px 0; }
  .kv b { color: var(--muted); font-weight: 500; }
  ul.plain { margin: 2px 0 8px; padding-left: 16px; }
  .empty { color: var(--muted); font-style: italic; }
  body.dragging { outline: 3px dashed var(--accent); outline-offset: -6px; }
</style>
</head>
<body>
<header>
  <h1>gloop log viewer</h1>
  <span class="sources" id="sources">no log loaded</span>
  <span class="stats" id="stats"></span>
  <label class="btn" id="demoBtn" hidden>Load demo</label>
  <label class="btn">Open .jsonl<input id="file" type="file" accept=".jsonl,.json,.txt" multiple></label>
</header>
<main>
  <div id="graphWrap" class="empty"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="side">
    <section class="panel" id="turnPanel"><h2>Turn</h2><div class="empty">Select a turn in the graph.</div></section>
    <section class="panel" id="inspector"><h2>Event</h2><div class="empty">Select an event.</div></section>
  </div>
  <footer>
    <div id="scrubRow">
      <span>State at</span>
      <input id="scrub" type="range" min="0" max="0" value="0">
      <span id="scrubLabel">—</span>
      <select id="agent"></select>
    </div>
    <div id="state">
      <section class="panel" id="history"><h2>Conversation</h2><div class="empty">Load a log.</div></section>
      <section class="panel" id="meta"><h2>Agent state</h2></section>
    </div>
  </footer>
</main>

<!--APP-->
</body>
</html>

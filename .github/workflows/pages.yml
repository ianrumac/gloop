name: Pages

# Deploys the homepage (lander/) and the log viewer (/viewer/) to GitHub
# Pages whenever main moves.  The same lander/dist is what `wrangler deploy`
# publishes to Cloudflare, so both hosts serve identical content.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site + viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build homepage
        working-directory: lander
        run: |
          bun install
          bunx vite build --base=./

      - name: Build log viewer (with demo log)
        run: bun src/viewer/build-static.ts lander/dist/viewer

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lander/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

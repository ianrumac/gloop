name: Publish

# Publishes @hypen-space/gloop-loop and @hypen-space/gloop-effect to npm
# whenever main moves (merge or direct push) and the version in a package's
# package.json is not yet on the registry. Bump the version + changelog in
# the PR; the merge does the publish.
#
# Requires the NPM_TOKEN repository secret (an npm automation token with
# publish rights to the @hypen-space scope).
#
# `bun publish` is used instead of `npm publish` because gloop-effect
# depends on gloop-loop via the workspace: protocol, which bun rewrites to
# the real version at pack time (npm would publish the literal "workspace:*").

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Writes ~/.npmrc with //registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN,
      # which both npm (view) and bun (publish) pick up.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # gloop-loop first — gloop-effect depends on it.
      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in packages/gloop-loop packages/gloop-effect; do
            name=$(bun -e "console.log(require('./$pkg/package.json').name)")
            version=$(bun -e "console.log(require('./$pkg/package.json').version)")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on npm — skipping"
            else
              echo "Publishing $name@$version"
              (cd "$pkg" && bun publish --access public)
            fi
          done

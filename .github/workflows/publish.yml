name: Publish

# Publishes @hypen-space/gloop-loop and @hypen-space/gloop-effect to npm
# whenever main moves (merge or direct push) and the version in a package's
# package.json is not yet on the registry. Bump the version + changelog in
# the PR; the merge does the publish.
#
# Requires the NPM_TOKEN secret in the "Publish" environment (an npm
# automation token with publish rights to the @hypen-space scope).
#
# Packing and publishing are split between the two tools on purpose:
#   - `bun pm pack` rewrites gloop-effect's workspace: dependency on
#     gloop-loop to the real version (npm would pack the literal
#     "workspace:*" and produce an uninstallable package).
#   - `npm publish <tarball>` does the upload, because bun's publish auth
#     does not read ~/.npmrc tokens in CI ("missing authentication"),
#     while npm reads ~/.npmrc reliably.
# NOTE: bun.lock snapshots each workspace package's version — regenerate it
# (rm bun.lock && bun install) after bumping versions, or the packed
# dependency range will point at the OLD version.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # gloop-loop first — gloop-effect depends on it.
      - name: Publish changed packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for pkg in packages/gloop-loop packages/gloop-effect; do
            name=$(bun -e "console.log(require('./$pkg/package.json').name)")
            version=$(bun -e "console.log(require('./$pkg/package.json').version)")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on npm — skipping"
              continue
            fi
            echo "Publishing $name@$version"
            (
              cd "$pkg"
              bun run build
              bun pm pack --destination ./pack-out
              npm publish ./pack-out/*.tgz --access public
            )
          done
